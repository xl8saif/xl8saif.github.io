name: Use uploaded portfolio logos

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  update-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use uploaded logos with visible white backgrounds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # GitHub Pages exposes Vite's public/ directory at the site root.
          s = s.replace('./public/images/', './images/')

          # Remove cards for organizations whose logo files have not been uploaded.
          missing_hrefs = [
              'https://www.sta.gov.sa/',
              'https://www.productiveplayhouse.com/',
              'https://www.pubgmobile.com/',
          ]
          for href in missing_hrefs:
              pattern = r'<a class="logo-card" href="' + re.escape(href) + r'".*?</a>'
              s = re.sub(pattern, '', s, flags=re.DOTALL)

          # Remove CSS-generated logo placeholders.
          for name in ['media-unit','alwaseemtranslation','haj\\.gov\\.sa','sta\\.gov\\.sa','productiveplayhouse','pubgmobile']:
              s = re.sub(r'\\.logo-card\\[href\\*="' + name + r'"\\]\\:before\\{[^}]*\\}', '', s)
          s = s.replace('.logo-card .mark,.logo-card:before{', '.logo-card .mark{')

          # Make every uploaded logo sit on a clean white tile so logos with
          # transparent/black artwork remain clearly visible against the dark glass UI.
          extra = '''
.logo-card img{display:block!important;width:76px;height:76px;flex:0 0 76px;min-width:76px;object-fit:contain;object-position:center;border-radius:12px;background:#fff!important;padding:8px;box-sizing:border-box;filter:none!important;mix-blend-mode:normal!important;opacity:1!important;visibility:visible!important;box-shadow:0 3px 12px rgba(0,0,0,.16)}
.logo-card{min-height:112px}
@media(max-width:700px){.logo-card img{width:56px;height:56px;flex-basis:56px;min-width:56px;padding:6px}.logo-card{min-height:92px}}
'''
          marker = '</style>\n</head>'
          if extra.strip() not in s:
              s = s.replace(marker, extra + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add white backgrounds to uploaded logos'
          git push
