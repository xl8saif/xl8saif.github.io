name: Use uploaded portfolio logos

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/workflows/use-uploaded-logos.yml'

permissions:
  contents: write

jobs:
  update-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace remote/generated logos with uploaded logo files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'https://media-unit.com/favicon.ico': './public/images/dmcc-media-unit-logo-01-8.webp',
              'https://alwaseemtranslation.com/favicon.ico': './public/images/alwaseemlogo.png',
              'https://haj.gov.sa/favicon.ico': './public/images/hajj&Umrahlogo.png',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          s = s.replace('<span class="mark">W</span>', '<img src="./public/images/waraq-logo.png" alt="Waraq Enterprises logo">')
          s = s.replace('<span class="mark">CT</span>', '<img src="./public/images/CloudTrans-Logo - Copy.PNG" alt="CloudTrans logo">')
          s = s.replace('<span class="mark">F</span>', '<img src="./public/images/FiKR&CD Logo.png" alt="FiKR&CD logo">')
          s = s.replace('.logo-card img{display:none!important}', '.logo-card img{display:block!important;width:62px;height:62px;flex:0 0 62px;object-fit:contain;object-position:center;border-radius:10px}')
          s = s.replace('.logo-card img,.logo-card .mark,.logo-card:before{width:34px;height:34px;flex-basis:34px}', '.logo-card img,.logo-card .mark,.logo-card:before{width:44px;height:44px;flex-basis:44px}')
          marker = '</style>\n</head>'
          extra = '''\n.logo-card img{display:block!important;width:62px;height:62px;flex:0 0 62px;object-fit:contain;object-position:center;border-radius:10px;filter:none;mix-blend-mode:normal}\n.logo-card{min-height:98px}\n@media(max-width:700px){.logo-card img{width:46px;height:46px;flex-basis:46px}.logo-card{min-height:82px}}\n'''
          if extra.strip() not in s:
              s = s.replace(marker, extra + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use uploaded organization logos in selected work'
          git push
