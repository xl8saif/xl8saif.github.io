name: Use uploaded portfolio logos

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  update-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use uploaded local portfolio logos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # GitHub Pages serves files inside public/ from the site root.
          s = s.replace('./public/images/', './images/')

          # Replace the external logo/favicons with the files the user uploaded.
          replacements = {
              'https://www.sta.gov.sa/favicon.ico': './images/saudi-tourism-authority-seeklogo.png',
              'https://www.productiveplayhouse.com/favicon.ico': './images/productiveplayhouselogo.jpg',
              'https://www.pubgmobile.com/favicon.ico': './images/Pubg-Mobile-Logo.png',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Also repair any accidental direct public/ paths for these files.
          for filename in [
              'saudi-tourism-authority-seeklogo.png',
              'productiveplayhouselogo.jpg',
              'Pubg-Mobile-Logo.png',
          ]:
              s = s.replace(f'./public/images/{filename}', f'./images/{filename}')

          # Remove CSS-generated initials so uploaded images are always the visible logo.
          patterns = [
              r'\.logo-card\[href\*="media-unit"\]\:before\{[^}]*\}',
              r'\.logo-card\[href\*="alwaseemtranslation"\]\:before\{[^}]*\}',
              r'\.logo-card\[href\*="haj\.gov\.sa"\]\:before\{[^}]*\}',
              r'\.logo-card\[href\*="sta\.gov\.sa"\]\:before\{[^}]*\}',
              r'\.logo-card\[href\*="productiveplayhouse"\]\:before\{[^}]*\}',
              r'\.logo-card\[href\*="pubgmobile"\]\:before\{[^}]*\}',
          ]
          for pattern in patterns:
              s = re.sub(pattern, '', s)

          # Ensure logos are large, crisp and readable on the glass cards.
          extra = '''
.logo-card img{display:block!important;width:76px;height:76px;flex:0 0 76px;min-width:76px;object-fit:contain;object-position:center;border-radius:12px;background:#fff!important;padding:8px;box-sizing:border-box;filter:none!important;mix-blend-mode:normal!important;opacity:1!important;visibility:visible!important;box-shadow:0 3px 12px rgba(0,0,0,.16)}
.logo-card{min-height:112px}
@media(max-width:700px){.logo-card img{width:56px;height:56px;flex-basis:56px;min-width:56px;padding:6px}.logo-card{min-height:92px}}
'''
          marker = '</style>\n</head>'
          if extra.strip() not in s:
              s = s.replace(marker, extra + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use uploaded portfolio logos'
          git push
