name: Use uploaded portfolio logos

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  update-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix uploaded logo paths and styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # GitHub Pages serves files inside public/ from the website root.
          s = s.replace('./public/images/', './images/')

          # Keep every manually uploaded logo as a local asset.
          # Do not replace remote logos for organizations whose logo files
          # have not been uploaded to public/images yet.

          # Remove any accidental CSS that hides uploaded logos.
          s = s.replace('.logo-card img{display:none!important}', '.logo-card img{display:block!important}')

          extra = '''
.logo-card img{display:block!important;width:72px;height:72px;flex:0 0 72px;min-width:72px;object-fit:contain;object-position:center;border-radius:10px;filter:none!important;mix-blend-mode:normal!important;opacity:1!important;visibility:visible!important;background:transparent}
.logo-card{min-height:108px}
@media(max-width:700px){.logo-card img{width:52px;height:52px;flex-basis:52px;min-width:52px}.logo-card{min-height:88px}}
'''
          marker = '</style>\n</head>'
          if extra.strip() not in s:
              s = s.replace(marker, extra + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix uploaded logo paths for GitHub Pages'
          git push