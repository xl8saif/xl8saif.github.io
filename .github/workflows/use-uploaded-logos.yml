name: Use uploaded portfolio logos

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  update-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use real uploaded logos only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # GitHub Pages exposes Vite's public/ directory at the site root.
          s = s.replace('./public/images/', './images/')

          # Remove cards whose logos were never uploaded instead of showing
          # CSS/text placeholders or unrelated logos.
          missing_hrefs = [
              'https://www.sta.gov.sa/',
              'https://www.productiveplayhouse.com/',
              'https://www.pubgmobile.com/',
          ]
          for href in missing_hrefs:
              pattern = r'<a class="logo-card" href="' + re.escape(href) + r'".*?</a>'
              s = re.sub(pattern, '', s, flags=re.DOTALL)

          # Remove all CSS-generated placeholder marks (MU, AW, SA, PP, PUBG, etc.).
          s = re.sub(r'\.logo-card\[href\*="media-unit"\]\:before\{[^}]*\}', '', s)
          s = re.sub(r'\.logo-card\[href\*="alwaseemtranslation"\]\:before\{[^}]*\}', '', s)
          s = re.sub(r'\.logo-card\[href\*="haj\.gov\.sa"\]\:before\{[^}]*\}', '', s)
          s = re.sub(r'\.logo-card\[href\*="sta\.gov\.sa"\]\:before\{[^}]*\}', '', s)
          s = re.sub(r'\.logo-card\[href\*="productiveplayhouse"\]\:before\{[^}]*\}', '', s)
          s = re.sub(r'\.logo-card\[href\*="pubgmobile"\]\:before\{[^}]*\}', '', s)
          s = s.replace('.logo-card .mark,.logo-card:before{', '.logo-card .mark{')

          # Uploaded image files are the only visual marks in each card.
          extra = '''
.logo-card img{display:block!important;width:72px;height:72px;flex:0 0 72px;min-width:72px;object-fit:contain;object-position:center;border-radius:10px;filter:none!important;mix-blend-mode:normal!important;opacity:1!important;visibility:visible!important;background:transparent}
.logo-card{min-height:108px}
@media(max-width:700px){.logo-card img{width:52px;height:52px;flex-basis:52px;min-width:52px}.logo-card{min-height:88px}}
'''
          marker = '</style>\n</head>'
          if extra.strip() not in s:
              s = s.replace(marker, extra + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove logo placeholders and use uploaded logos'
          git push
