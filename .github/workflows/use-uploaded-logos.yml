name: Use uploaded portfolio logos

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  update-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace placeholders with uploaded logos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # GitHub Pages exposes public/ at the site root.
          s = s.replace('./public/images/', './images/')

          # Use the logos actually uploaded to public/images/.
          replacements = {
              'https://www.sta.gov.sa/favicon.ico': './images/saudi-tourism-authority-seeklogo.png',
              'https://www.productiveplayhouse.com/favicon.ico': './images/productiveplayhouselogo.jpg',
              'https://www.pubgmobile.com/favicon.ico': './images/Pubg-Mobile-Logo.png',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Remove every CSS-generated placeholder/initials block.
          placeholder_rules = [
              r'\.logo-card\s*\.mark\s*,\s*\.logo-card\s*\:before\s*\{[^}]*\}',
              r'\.logo-card\s*\.mark\s*\{[^}]*\}',
              r'\.logo-card\[href\*="[^"]+"\]\s*\:before\s*\{[^}]*\}',
          ]
          for pattern in placeholder_rules:
              s = re.sub(pattern, '', s)

          # Remove any remaining empty placeholder elements from the logo cards.
          s = re.sub(r'<span\s+class=["\']mark["\'][^>]*>.*?</span>', '', s, flags=re.S)

          # Ensure uploaded images are the only visual mark and remain readable.
          extra = '''
.logo-card img{display:block!important;width:76px;height:76px;flex:0 0 76px;min-width:76px;object-fit:contain;object-position:center;border-radius:12px;background:#fff!important;padding:8px;box-sizing:border-box;filter:none!important;mix-blend-mode:normal!important;opacity:1!important;visibility:visible!important;box-shadow:0 3px 12px rgba(0,0,0,.16)}
.logo-card{min-height:112px}
.logo-card:before{content:none!important;display:none!important}
@media(max-width:700px){.logo-card img{width:56px;height:56px;flex-basis:56px;min-width:56px;padding:6px}.logo-card{min-height:92px}}
'''
          marker = '</style>\n</head>'
          if extra.strip() not in s:
              s = s.replace(marker, extra + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Replace logo placeholders with uploaded logos'
          git push
