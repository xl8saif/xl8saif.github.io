name: Load Arabic visual theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append Arabic theme to stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('style.css')
          theme=Path('arabic-theme.css')
          marker='/* ARABIC_THEME_LOADED */'
          s=css.read_text(encoding='utf-8')
          if marker not in s:
              s += '\n'+marker+'\n'+theme.read_text(encoding='utf-8')+'\n'
              css.write_text(s,encoding='utf-8')
          PY
      - name: Commit theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git diff --cached --quiet || git commit -m "Apply Arabic desert coffee gold theme"
          git push
