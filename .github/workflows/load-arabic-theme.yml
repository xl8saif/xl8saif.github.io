name: Load Arabic visual theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    if: ${{ !contains(github.event.head_commit.message, '[arabic-theme-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply current Arabic theme and QA overrides
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('style.css')
          theme_path = Path('arabic-theme.css')
          qc_path = Path('arabic-qc.css')

          css = css_path.read_text(encoding='utf-8')
          theme = theme_path.read_text(encoding='utf-8').strip()
          qc = qc_path.read_text(encoding='utf-8').strip()

          start = '/* ARABIC_THEME_LOADED */'
          end = '/* ARABIC_QC_LOADED */'

          # Remove every previously injected Arabic theme/QC block, then rebuild it
          # from the current source files. This prevents stale CSS from surviving
          # future typography or color changes.
          if start in css:
              css = css.split(start, 1)[0].rstrip() + '\n'
          elif end in css:
              css = css.split(end, 1)[0].rstrip() + '\n'

          css += f'\n{start}\n{theme}\n\n{end}\n{qc}\n'
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Commit refreshed Arabic CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          if git diff --cached --quiet; then
            echo "Arabic CSS already synchronized"
          else
            git commit -m "[arabic-theme-sync] Refresh Arabic typography and visual QA"
            git push
          fi
