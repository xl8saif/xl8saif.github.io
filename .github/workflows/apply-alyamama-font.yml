name: Apply Alyamama Site Font

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Alyamama globally
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          imp = "@import url('https://fonts.googleapis.com/css2?family=Alyamama:wght@300..900&display=swap');\n"
          if not s.startswith('@import url(\'https://fonts.googleapis.com/css2?family=Alyamama'):
              s = imp + s
          s = s.replace('font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif', 'font-family:"Alyamama",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif')
          s = s.replace('font-family:Inter,sans-serif', 'font-family:"Alyamama",Inter,sans-serif')
          s = s.replace('font-family:Georgia,"Times New Roman",serif', 'font-family:"Alyamama",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif')
          s = s.replace('font-family:Georgia,serif', 'font-family:"Alyamama",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif')
          marker = '/* GLOBAL ALYAMAMA FONT */'
          if marker not in s:
              s += '\n' + marker + '\nhtml,body,button,input,textarea,select,option,a,h1,h2,h3,h4,h5,h6,p,span,strong,small,label,li,td,th{font-family:"Alyamama",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}\n'
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit font changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply Alyamama font globally [skip ci]"
          git push
